# Scaffold for .github/workflows/ci-quality.yml (jobs appended below).
# Managed in part by internal-watchmen.
#
# This repository is public, and GitHub does not let a public repository use actions from the
# private TheDataCity/github-actions repository. So each job runs the same check as the shared
# lint-pip-audit, lint-ruff and lint-semgrep actions, with public actions only.

name: CI quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv audit --preview --frozen

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # The Ruff version comes from uv.lock, as in lint-ruff.
      - run: uv run --frozen --only-dev ruff check .

  semgrep:
    runs-on: ubuntu-latest
    # lint-semgrep skips Dependabot runs too.
    if: github.actor != 'dependabot[bot]'
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      # The same scan as lint-semgrep in Docker mode, with the same excluded rule.
      - run: >-
          semgrep scan --config auto --error
          --exclude-rule=yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
          .

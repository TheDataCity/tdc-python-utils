# Generated from pipelines/dependabot golden templates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(CI)"
    # Floating @v1/@v2 tags; only open PRs on major bumps for our shared actions.
    # Third-party actions (actions/checkout, etc.) still get minor/patch updates.
    ignore:
      - dependency-name: "TheDataCity/github-actions*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      github-actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      # [skip ci] in title/commit so PR workflows do not run for hook pin bumps.
      prefix: "[skip ci] deps(pre-commit)"
    groups:
      pre-commit-deps:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(uv)"
    # Minor and patch updates share one PR; each major update gets its own, so one
    # breaking upgrade cannot hold back the rest.
    groups:
      uv-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

